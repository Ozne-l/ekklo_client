name: ekklo_client
description: Unofficial Dart client for the Ekklo coaching app (client account) - food search, custom foods, daily meals, nutrition targets and messaging. Requires dart:io.
version: 0.1.0
publish_to: none
repository: https://github.com/Ozne-l/ekklo_client

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.12.2

dependencies:
  dart_mappable: ^4.10.0
  http: ^1.6.0
  web_socket: ^1.0.1

dev_dependencies:
  build_runner: ^2.16.1
  checks: ^0.3.2
  dart_mappable_builder: ^4.10.0
  fake_async: ^1.3.3
  test: ^1.32.0
  very_good_analysis: ^10.3.0
